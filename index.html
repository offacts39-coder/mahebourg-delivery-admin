<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mahebourg Delivery Admin</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f8;color:#17202a}header{background:#111827;color:white;padding:18px}
main{max-width:900px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border-radius:9px;border:1px solid #ddd}
button{background:#16a34a;color:white;border:0;font-weight:bold}.blue{background:#2563eb}.red{background:#dc2626}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}.muted{color:#6b7280;font-size:13px}
</style></head><body>
<header><h2>🛵 Mahebourg Delivery</h2><div>Admin Panel</div></header><main>
<div id="login" class="card"><h3>Admin Login</h3><input id="pin" type="password" placeholder="Admin PIN"><button onclick="login()">Login</button><p id="msg" class="muted"></p></div>
<div id="app" class="hidden"><div class="card"><h3>📊 Orders</h3><div id="count"></div><button class="blue" onclick="listen()">Refresh</button></div><div id="orders"></div></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {getDatabase,ref,onValue,update} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyBZzPmYBJNqio_IDrPn6abTVFoci-7GKtI",authDomain:"delivery-5d936.firebaseapp.com",databaseURL:"https://delivery-5d936-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"delivery-5d936",storageBucket:"delivery-5d936.firebasestorage.app",messagingSenderId:"980186352754",appId:"1:980186352754:web:02785a4144fd6f174746eb"};
const db=getDatabase(initializeApp(firebaseConfig));
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
window.login=()=>{if(document.getElementById("pin").value==="1234"){sessionStorage.admin="1";document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");listen()}else document.getElementById("msg").textContent="Wrong PIN";};
window.listen=()=>onValue(ref(db,"orders"),s=>{let d=s.val()||{},ids=Object.keys(d);document.getElementById("count").textContent=ids.length+" order(s)";document.getElementById("orders").innerHTML=ids.reverse().map(id=>{let o=d[id]||{},s=o.status||"New";return `<div class="card"><h3>📦 ${esc(id)}</h3><b>Status: ${esc(s)}</b><p><b>Customer:</b> ${esc(o.customerName||o.name)}</p><p><b>Phone:</b> ${esc(o.phone)}</p><p><b>Items:</b><br>${esc(o.items)}</p><p><b>Pickup:</b> ${esc(o.pickupLocation||o.pickup)}</p><p><b>Delivery:</b> ${esc(o.deliveryLocation||o.delivery)}</p><div class="grid"><button onclick="status('${id}','Accepted')">Accept</button><button class="blue" onclick="status('${id}','Shopping Started')">Shopping Started</button><button class="blue" onclick="status('${id}','Out for Delivery')">Out for Delivery</button><button onclick="status('${id}','Delivered')">Delivered</button></div><button class="red" onclick="status('${id}','Cancelled')">Cancel</button></div>`}).join("")||"<div class='card'>No orders yet.</div>"}); 
window.status=async(id,s)=>update(ref(db,"orders/"+id),{status:s});
if(sessionStorage.admin==="1"){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");listen();}
</script></body></html>
